name: Build

on:
  push:
    tags:
      - 'v*'

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FBX SDK
        uses: actions/checkout@v4
        with:
          repository: halby24/fbx-sdk
          token: ${{ secrets.FBXSDK_PAT }}
          lfs: true
          path: fbx-sdk

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch vcpkg baseline
        run: git -C C:\vcpkg fetch --depth=1 origin 77df67cfff9c12ccfdb52284e07c87c75092f723
        shell: cmd

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DFBXSDK_ROOT=${{ github.workspace }}/fbx-sdk/windows

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalbyFbxEditor-windows
          path: |
            build/src/Release/HalbyFbxEditor.exe
            build/src/Release/*.dll
            build/src/Release/platforms/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FBX SDK
        uses: actions/checkout@v4
        with:
          repository: halby24/fbx-sdk
          token: ${{ secrets.FBXSDK_PAT }}
          lfs: true
          path: fbx-sdk

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DFBXSDK_ROOT=${{ github.workspace }}/fbx-sdk/linux

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalbyFbxEditor-linux
          path: build/src/HalbyFbxEditor
